<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>人，进来！向左滑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: pan-y pinch-zoom;
        }
        .slider-container {
            width: 100vw;
            max-width: 600px;
            overflow: hidden;
            position: relative;
            background: white;
        }
        .slider {
            display: flex;
            transition: transform 0.3s ease-out;
            cursor: grab;
        }
        .slider:active {
            cursor: grabbing;
        }
        .slide {
            min-width: 100vw;
            max-width: 600px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }
        /* 适配移动端 */
        @media (max-width: 600px) {
            .slider-container, .slide {
                max-width: 100vw;
            }
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <div class="slider" id="slider">
            <div class="slide">
                <img src="img1.jpg" alt="第一张">
            </div>
            <div class="slide">
                <img src="img2.jpg" alt="第二张">
            </div>
            <div class="slide">
                <img src="img3.jpg" alt="第三张">
            </div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        let isDragging = false;
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        const slideWidth = window.innerWidth > 600 ? 600 : window.innerWidth;
        const maxTranslate = -(slideWidth * 2); // 最多滑到第三张
        const minTranslate = 0; // 最少在第一张

        // 鼠标/触摸事件监听
        slider.addEventListener('mousedown', startDrag);
        slider.addEventListener('touchstart', startDrag, { passive: true });
        slider.addEventListener('mousemove', drag);
        slider.addEventListener('touchmove', drag, { passive: true });
        slider.addEventListener('mouseup', endDrag);
        slider.addEventListener('mouseleave', endDrag);
        slider.addEventListener('touchend', endDrag);

        function startDrag(e) {
            isDragging = true;
            startX = getPositionX(e);
            slider.style.transition = 'none';
        }

        function drag(e) {
            if (!isDragging) return;
            const currentX = getPositionX(e);
            const diff = currentX - startX;
            currentTranslate = prevTranslate + diff;
            
            // 限制滑动范围
            if (currentTranslate < maxTranslate) {
                currentTranslate = maxTranslate;
            }
            if (currentTranslate > minTranslate) {
                currentTranslate = minTranslate;
            }
            
            setSliderPosition();
        }

        function endDrag() {
            isDragging = false;
            
            // 自动吸附到对应图片
            const movedBy = currentTranslate - prevTranslate;
            if (movedBy < -slideWidth / 4 && currentTranslate > maxTranslate) {
                prevTranslate -= slideWidth;
            } else if (movedBy > slideWidth / 4 && currentTranslate < minTranslate) {
                prevTranslate += slideWidth;
            }
            
            // 再次限制范围
            if (prevTranslate < maxTranslate) prevTranslate = maxTranslate;
            if (prevTranslate > minTranslate) prevTranslate = minTranslate;
            
            currentTranslate = prevTranslate;
            slider.style.transition = 'transform 0.3s ease-out';
            setSliderPosition();
        }

        function getPositionX(e) {
            return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
        }

        function setSliderPosition() {
            slider.style.transform = `translateX(${currentTranslate}px)`;
        }

        // 窗口大小变化时更新
        window.addEventListener('resize', () => {
            const newSlideWidth = window.innerWidth > 600 ? 600 : window.innerWidth;
            const newMaxTranslate = -(newSlideWidth * 2);
            if (prevTranslate < newMaxTranslate) prevTranslate = newMaxTranslate;
            if (prevTranslate > 0) prevTranslate = 0;
            currentTranslate = prevTranslate;
            setSliderPosition();
        });
    </script>
</body>
</html>
