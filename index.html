<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>左滑看图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* 只禁止横向滚动 */
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrapper {
            width: 100vw;
            max-width: 600px;
            height: auto;
            overflow: hidden;
            position: relative;
        }
        .slider {
            display: flex;
            transition: transform 0.3s ease-out;
            will-change: transform;
        }
        .slide {
            min-width: 100%;
            flex-shrink: 0;
        }
        .slide img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="slider" id="slider">
            <div class="slide"><img src="img1.jpg" alt="第一张"></div>
            <div class="slide"><img src="img2.jpg" alt="第二张"></div>
            <div class="slide"><img src="img3.jpg" alt="第三张"></div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        let startX = 0;
        let currentX = 0;
        let isDragging = false;
        let index = 0;
        const totalSlides = 3;

        // 触摸开始
        slider.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            slider.style.transition = 'none';
        }, { passive: true });

        // 触摸移动
        slider.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const diff = startX - currentX;
            // 实时跟随手指移动
            slider.style.transform = `translateX(calc(-${index * 100}% - ${diff}px))`;
        }, { passive: true });

        // 触摸结束
        slider.addEventListener('touchend', () => {
            isDragging = false;
            const diff = startX - currentX;
            const threshold = 50; // 滑动超过50px才翻页

            if (diff > threshold && index < totalSlides - 1) {
                index++; // 左滑到下一张
            } else if (diff < -threshold && index > 0) {
                index--; // 右滑回上一张
            }

            // 回到对应位置，带平滑动画
            slider.style.transition = 'transform 0.3s ease-out';
            slider.style.transform = `translateX(-${index * 100}%)`;
        });
    </script>
</body>
