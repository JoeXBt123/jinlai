<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>左滑看图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;          /* 禁止整个页面弹性滚动 */
    background: #000;
  }
  .wrapper {
    width: 100vw;
    height: 100dvh;            /* dvh 对移动端地址栏伸缩更友好 */
    overflow: hidden;
    position: relative;
  }
  .slider {
    display: flex;
    height: 100%;
    /* 注意：不设 width，让 flex 子项撑开；位移用 JS 的 px 值控制 */
    will-change: transform;
  }
  .slide {
    flex: 0 0 100vw;           /* ✅ 关键：不缩不放，固定一屏宽 */
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;       /* 图片不变形，居中自适应 */
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="slider" id="slider">
    <div class="slide"><img src="img1.jpg" alt="第一张"></div>
    <div class="slide"><img src="img2.jpg" alt="第二张"></div>
    <div class="slide"><img src="img3.jpg" alt="第三张"></div>
  </div>
</div>

<script>
const slider = document.getElementById('slider');
const total = slider.children.length;   // 3
let index = 0;
let startX = 0;
let dragging = false;
const threshold = 50;                     // 滑动阈值 px

/* ---------- 工具：设置位置（带/不带动画） ---------- */
function goTo(i, animate = true) {
  i = Math.max(0, Math.min(i, total - 1)); // 钳住边界
  index = i;
  slider.style.transition = animate ? 'transform 0.35s cubic-bezier(.25,.8,.25,1)' : 'none';
  slider.style.transform = `translateX(-${index * window.innerWidth}px)`;
}

/* 初始化位置 */
goTo(0, false);

/* ---------- touchstart ---------- */
slider.addEventListener('touchstart', (e) => {
  dragging = true;
  startX = e.touches[0].clientX;
  slider.style.transition = 'none';      // 拖拽阶段关动画
}, { passive: true });

/* ---------- touchmove ---------- */
slider.addEventListener('touchmove', (e) => {
  if (!dragging) return;
  const x = e.touches[0].clientX;
  const diff = x - startX;               // 手指偏移量（右滑为正，左滑为负）

  // 边界阻力：已经在第一张不能再右拖，已经在最后一张不能再左拖
  let clampedDiff = diff;
  if (index === 0 && diff > 0) clampedDiff = diff * 0.3;
  if (index === total - 1 && diff < 0) clampedDiff = diff * 0.3;

  slider.style.transform =
    `translateX(calc(${-index * window.innerWidth}px + ${clampedDiff}px))`;
}, { passive: true });

/* ---------- touchend ---------- */
slider.addEventListener('touchend', (e) => {
  if (!dragging) return;
  dragging = false;

  // 用 changedTouches 拿松手那一瞬的坐标（更可靠）
  const endX = e.changedTouches[0].clientX;
  const diff = endX - startX;

  if (Math.abs(diff) > threshold) {
    if (diff < 0 && index < total - 1) index++;   // 左滑 → 下一张
    else if (diff > 0 && index > 0) index--;       // 右滑 → 上一张
  }

  goTo(index, true);   // 吸附到目标页（带动画）
});
</script>
</body>
</html>
