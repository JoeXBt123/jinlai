<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>左滑看图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; }
  .slider {
    display:flex;
    width:300vw;
    height:100vh;
    transition:transform 0.3s ease-out;
  }
  .slide {
    width:100vw;
    height:100vh;
  }
  .slide img {
    width:100%;
    height:100%;
    object-fit:cover;
  }
</style>
</head>
<body>
<div class="slider" id="slider">
  <div class="slide"><img src="img1.jpg"></div>
  <div class="slide"><img src="img2.jpg"></div>
  <div class="slide"><img src="img3.jpg"></div>
</div>

<script>
let slider=document.getElementById('slider');
let startX=0, currentX=0, diff=0;
let page=0;

document.addEventListener('touchstart', e=>{
  startX=e.touches[0].clientX;
});
document.addEventListener('touchmove', e=>{
  currentX=e.touches[0].clientX;
  diff=startX-currentX;
});
document.addEventListener('touchend', ()=>{
  if (diff>50 && page<2) page++;
  if (diff<-50 && page>0) page--;
  slider.style.transform=`translateX(-${page*100}vw)`;
});
</script>
</body>
</html>
